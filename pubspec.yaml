name: aud_audio_link
description: "Ableton Link transport provider of the Audanika Audio Engine; fetches Link and LinkKit at build time, app publishers license Link themselves"
version: 0.0.2
publish_to: none
homepage: https://github.com/audaudio/aud_audio_link
repository: https://github.com/audaudio/aud_audio_link

environment:
  sdk: ^3.12.2

dependencies:
  aud_audio_graph:
    git:
      url: git@github.com:audaudio/aud_audio_graph.git
      tag_pattern: "{{version}}"
    version: ^0.0.2
  code_assets: ^2.1.0
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.5

dev_dependencies:
  dna_audanika: ^0.0.2
  ffi: ^2.2.0
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  helix: ^1.11.0
  test: ^1.32.0